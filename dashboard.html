<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Makanan Bergizi Gratis</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Desktop Navbar -->
  <div class="navbar-bg"></div>
  <nav class="navbar">
    <div class="nav-left">
      <img src="img/logo.webp" class="logo" width="30px">
      <span class="instansi">BADAN GIZI NASIONAL</span>
    </div>
    <div class="nav-center">
      <a href="dashboard.html" class="nav-link">Informasi</a>
      <a href="tracking.html" class="nav-link">Tracking</a>
      <a href="stok.html" class="nav-link">Stok</a>
    </div>
    <div class="nav-right">
      <span id="welcomeText"></span>
      <button class="logout-btn">Logout</button>
    </div>
  </nav>

  <!-- Mobile Navbar -->
  <nav class="navbar-mobile">
    <div class="nav-left">
      <div class="hamburger" id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <img src="img/logo.webp" class="logo" width="30px">
    </div>
  </nav>

  <!-- Mobile Sidebar -->
  <div class="mobile-sidebar" id="mobileSidebar">
    <div class="sidebar-header">
      <img src="img/logo.webp" class="logo" width="30px">
      <span class="instansi">BADAN GIZI NASIONAL</span>
      <button class="close-sidebar" id="closeSidebar">&times;</button>
    </div>
    <ul class="sidebar-nav">
      <li><a href="dashboard.html" class="nav-link">Informasi</a></li>
      <li><a href="tracking.html" class="nav-link">Tracking</a></li>
      <li><a href="stok.html" class="nav-link">Stok</a></li>
    </ul>
    <div class="sidebar-footer">
      <span id="mobileWelcomeText"></span>
      <button class="logout-btn" id="mobileLogout">Logout</button>
    </div>
  </div>

  <div class="slide" id="slide1">
    <div class="slide-bg"></div>
    <div class="marquee">
      <span>DEMI BANGSA</span>
    </div>
    <div class="slide-fg"></div>
    <div class="slide-blue-overlay"></div>
    <div class="cards-overlay" id="statCards"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
